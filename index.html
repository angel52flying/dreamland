<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dreamland</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700&family=Noto+Sans+TC:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6ece0;--bg2:#efdfcb;--card:#fffaf3;--line:#d8bf9f;--ink:#4a3226;--soft:#8a6b55;--brand:#8b5e3c;--brand2:#b98a62;--on:#fff8ee;--sh:0 10px 30px rgba(94,60,34,.12);--serif:"Noto Serif TC","Songti TC",Georgia,serif;--sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2a1d16;--bg2:#35261d;--card:#3d2c22;--line:#6a4d3a;--ink:#f3e4d2;--soft:#c3a68b;--brand:#d4a574;--brand2:#b98a62;--on:#2a1d16;--sh:0 10px 30px rgba(0,0,0,.35)}}
:root[data-theme="dark"]{--bg:#2a1d16;--bg2:#35261d;--card:#3d2c22;--line:#6a4d3a;--ink:#f3e4d2;--soft:#c3a68b;--brand:#d4a574;--brand2:#b98a62;--on:#2a1d16;--sh:0 10px 30px rgba(0,0,0,.35)}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-behavior:smooth;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:16px/1.8 var(--sans)}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--serif);margin:0;line-height:1.3}
.wrap{max-width:1040px;margin:0 auto;padding:0 20px}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;align-items:center;gap:12px;height:56px}
.logo{font-family:var(--serif);font-weight:700;font-size:20px;color:var(--brand);cursor:pointer;margin-right:auto}
.btn{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 16px;cursor:pointer;transition:.2s}
.btn:hover{border-color:var(--brand)}.btn.main{background:var(--brand);color:var(--on);border-color:var(--brand)}
.btn:focus-visible,.item:focus-visible,.tile:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
#view{animation:fade .5s ease both}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.rv{opacity:0;transform:translateY(24px);transition:opacity .8s ease,transform .8s ease}.rv.in{opacity:1;transform:none}
.hero{text-align:center;padding:96px 20px 80px;background:radial-gradient(ellipse at 50% 0,var(--bg2),transparent 70%)}
.hero h1{font-size:clamp(34px,7vw,68px);font-weight:700;color:var(--brand);letter-spacing:.01em;max-width:12em;margin:0 auto}
.hero p{color:var(--soft);margin:18px auto 30px;max-width:30em}
.sec{padding:56px 0}
.sec>.wrap>h2,.blk>h2{font-size:26px;margin-bottom:6px}
.sub{color:var(--soft);margin:0 0 24px;font-size:14px}
.big{border:2px dashed var(--brand2);border-radius:28px;background:color-mix(in srgb,var(--card) 70%,transparent);padding:20px;display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:18px}
.plus{display:flex;align-items:center;justify-content:center;min-height:170px;border-radius:20px;border:0;background:var(--bg2);color:var(--brand);font-size:56px;font-weight:300;cursor:pointer;transition:.25s}
.plus:hover{transform:scale(1.03);background:var(--line)}
.tile{position:relative;min-height:170px;border-radius:20px;background:var(--card);box-shadow:var(--sh);padding:22px;cursor:pointer;display:flex;flex-direction:column;justify-content:flex-end;transition:.25s;border-left:6px solid var(--brand2)}
.tile:hover{transform:translateY(-4px)}
.tile h3{font-size:20px}.tile small{color:var(--soft)}
.x{position:absolute;top:8px;right:8px;width:28px;height:28px;border:0;border-radius:50%;background:transparent;color:var(--soft);cursor:pointer;font-size:18px;line-height:1}.x:hover{background:var(--bg2);color:var(--ink)}
.empty{grid-column:1/-1;text-align:center;color:var(--soft);font-size:14px;align-self:center}
.page{padding:36px 0 80px}
.ttl{font-size:clamp(28px,5vw,42px);width:100%;border:0;background:transparent;color:var(--brand);font-weight:700;padding:4px 0;border-bottom:1px dashed transparent;outline:0}
.ttl:focus{border-bottom-color:var(--brand2)}
.blk{background:var(--card);border-radius:24px;box-shadow:var(--sh);padding:26px;margin-top:24px}
.area{width:100%;min-height:150px;resize:vertical;border:1px solid var(--line);background:var(--bg);border-radius:14px;padding:14px;line-height:1.9;outline:0}
.area:focus{border-color:var(--brand)}
.list{display:flex;flex-wrap:wrap;gap:12px}
.item{position:relative;border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:8px 40px 8px 20px;cursor:pointer;transition:.2s}
.item:hover{background:var(--bg2);border-color:var(--brand)}
.item .x{top:50%;right:6px;transform:translateY(-50%)}
body:not(.hasdl) .exp{display:none}.exp{margin:4px 0 0}.clist{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}.crow{position:relative;display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:10px 46px 10px 6px;cursor:pointer;transition:background .2s,box-shadow .2s}.crow:hover{background:var(--bg2);border-color:var(--brand)}.crow.drag{box-shadow:var(--sh);background:var(--bg2);border-color:var(--brand)}.crow .x{top:50%;right:8px;transform:translateY(-50%)}.grip{touch-action:none;cursor:grab;color:var(--soft);padding:6px 10px;user-select:none;letter-spacing:-3px}.grip:active{cursor:grabbing}.item.add{padding:8px 22px;background:var(--brand);color:var(--on);border-color:var(--brand);font-size:20px;line-height:1.4}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.fgrid .blk{margin:0}.fgrid .full{grid-column:1/-1}
.fgrid h3{font-size:19px;margin-bottom:10px;color:var(--brand)}
.tb{position:sticky;top:calc(56px + env(safe-area-inset-top,0px));z-index:10;display:flex;flex-wrap:wrap;gap:6px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:8px;margin:20px 0;box-shadow:var(--sh)}
.tb button,.tb select{border:1px solid transparent;background:var(--bg);border-radius:10px;min-width:36px;height:36px;padding:0 8px;cursor:pointer}
.tb button:hover,.tb select:hover{border-color:var(--brand)}
.tb .sp{width:1px;height:24px;background:var(--line);margin:0 4px}
.paper{min-height:60vh;background:var(--card);border-radius:20px;padding:34px;box-shadow:var(--sh);outline:0;font-family:var(--serif);font-size:18px;line-height:2.1;word-break:break-word}
.paper:empty::before{content:"從這裡開始寫下你的故事…";color:var(--soft)}
.cnt{text-align:right;color:var(--soft);font-size:13px;margin-top:8px}
.mask{position:fixed;inset:0;z-index:50;background:rgba(50,30,18,.45);display:flex;align-items:center;justify-content:center;padding:20px;animation:fade .25s both}
.dlg{background:var(--card);border-radius:22px;padding:26px;width:min(420px,100%);box-shadow:var(--sh)}
.dlg h3{margin-bottom:14px}.dlg input{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:10px 14px;outline:0;margin-bottom:16px}
.dlg input:focus{border-color:var(--brand)}.dlg .row{display:flex;gap:10px;justify-content:flex-end}
@media(max-width:640px){.fgrid{grid-template-columns:1fr}.hero{padding:64px 20px 56px}.paper{padding:22px 18px}.blk{padding:20px}.tb{top:calc(56px + env(safe-area-inset-top,0px))}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.rv{opacity:1;transform:none}}
</style>
</head>
<body>
<header class="bar"><div class="wrap">
<span class="logo" id="logo" tabindex="0">Dreamland</span>
<button class="btn" id="back" hidden>返回</button>
<button class="btn" id="theme" aria-label="切換深淺色">☾</button>
</div></header>
<main id="view"></main>
<script>
(function(){
var S={stories:[]},$=function(s,r){return(r||document).querySelector(s)},V=$('#view');
try{var d=localStorage.getItem('dreamland');if(d)S=JSON.parse(d)}catch(e){}
function save(){try{localStorage.setItem('dreamland',JSON.stringify(S))}catch(e){}}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function esc(t){return String(t==null?'':t).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function story(id){return S.stories.filter(function(s){return s.id===id})[0]}
function dlg(title,opt,ok){
 var m=document.createElement('div');m.className='mask';
 m.innerHTML='<div class="dlg" role="dialog"><h3>'+esc(title)+'</h3>'+(opt.input?'<input maxlength="40" placeholder="'+esc(opt.ph||'')+'">':'<p style="margin:0 0 16px;color:var(--soft)">'+esc(opt.msg||'')+'</p>')+'<div class="row"><button class="btn" data-c>取消</button><button class="btn main" data-o>'+(opt.ok||'確定')+'</button></div></div>';
 document.body.appendChild(m);var i=$('input',m);if(i)i.focus();
 function close(){m.remove()}
 function go(){var v=i?i.value.trim():true;if(!v)return;close();ok(v)}
 $('[data-c]',m).onclick=close;$('[data-o]',m).onclick=go;
 m.onclick=function(e){if(e.target===m)close()};
 if(i)i.onkeydown=function(e){if(e.key==='Enter')go();if(e.key==='Escape')close()};
}
function reveal(){
 var els=document.querySelectorAll('.rv');
 if(!('IntersectionObserver' in window)){els.forEach(function(e){e.classList.add('in')});return}
 var o=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add('in');o.unobserve(e.target)}})},{threshold:.12});
 els.forEach(function(e){o.observe(e)});
}
function show(html,back){
 V.style.animation='none';void V.offsetWidth;V.style.animation='';
 V.innerHTML=html;window.scrollTo(0,0);$('#back').hidden=!back;
 if(back)$('#back').onclick=function(){location.hash=back};
 reveal();
}
function bind(el,obj,key){el.oninput=function(){obj[key]=el.value;save()}}

/* 匯出 */
var DL=null;
if(window.claude&&claude.use)claude.use('downloads').then(function(d){DL=d;if(d)document.body.classList.add('hasdl')}).catch(function(){});
function h2t(h){h=h.replace(/<br\s*\/?>/gi,'\n').replace(/<\/(div|p|li)>/gi,'\n');return new DOMParser().parseFromString(h,'text/html').body.textContent.replace(/\n{3,}/g,'\n\n').trim()}
function storyTxt(s){
 var L=['《'+s.title+'》','','【世界觀與故事介紹】',s.intro||'（尚未填寫）',''];
 if(s.chars.length){L.push('【角色】','');s.chars.forEach(function(c){L.push('■ '+c.name);[['personality','個性和性格'],['look','外觀'],['background','背景'],['extra','額外設定'],['relations','關係']].forEach(function(f){if(c[f[0]])L.push(f[1]+'：'+c[f[0]])});L.push('')})}
 if(s.chapters.length){L.push('【章節】','');s.chapters.forEach(function(w){L.push('── '+w.title+' ──','',h2t(w.html),'')})}
 return L.join('\n');
}
function exportTxt(name,text){
 if(!DL)return;
 DL.save({filename:(name.replace(/[\\/:*?"<>|]/g,'').trim()||'dreamland')+'.txt',data:text}).catch(function(e){if(e&&e.code!=='declined')dlg('無法匯出',{msg:'目前的環境無法儲存檔案，請稍後再試。',ok:'知道了'},function(){})});
}

/* 首頁 */
function home(){
 var t=S.stories.map(function(s){return'<div class="tile" tabindex="0" data-go="#/s/'+s.id+'"><button class="x" data-del="'+s.id+'" aria-label="刪除故事">×</button><h3>'+esc(s.title)+'</h3><small>'+s.chars.length+' 位角色 · '+s.chapters.length+' 個章節</small></div>'}).join('');
 show('<section class="hero"><h1>Let\'s make your own dreamland</h1><p>把腦中的世界、人物與章節，一點一點收進這裡。</p><button class="btn main" id="start">開始築夢</button></section>'+
 '<section class="sec" id="stories"><div class="wrap rv"><h2>我的故事</h2><p class="sub">按下 + 新增一個故事，點擊故事即可進入它的世界。</p><div class="big"><button class="plus" id="addS" aria-label="新增故事">+</button>'+(t||'<p class="empty">還沒有故事，從 + 開始吧。</p>')+'</div></div></section>');
 $('#start').onclick=function(){$('#stories').scrollIntoView({behavior:'smooth'})};
 $('#addS').onclick=function(){dlg('新故事的名字',{input:1,ph:'例如：雲端上的茶館'},function(n){var s={id:uid(),title:n,intro:'',chars:[],chapters:[]};S.stories.push(s);save();location.hash='#/s/'+s.id})};
 V.querySelectorAll('[data-go]').forEach(function(e){e.onclick=function(){location.hash=e.dataset.go};e.onkeydown=function(k){if(k.key==='Enter')e.click()}});
 V.querySelectorAll('[data-del]').forEach(function(b){b.onclick=function(ev){ev.stopPropagation();dlg('刪除這個故事？',{msg:'故事中的角色與章節也會一併刪除。',ok:'刪除'},function(){S.stories=S.stories.filter(function(s){return s.id!==b.dataset.del});save();home()})}});
}

/* 背景展示區 */
function bg(s){
 function list(a,k){return a.map(function(x){return k==='w'?'<div class="crow" data-id="'+x.id+'" tabindex="0" data-go="#/s/'+s.id+'/w/'+x.id+'"><span class="grip" aria-label="拖曳排序" title="拖曳排序">⋮⋮</span><span>'+esc(x.title)+'</span><button class="x" data-del="w'+x.id+'" aria-label="刪除">×</button></div>':'<div class="item" tabindex="0" data-go="#/s/'+s.id+'/c/'+x.id+'">'+esc(x.name)+'<button class="x" data-del="c'+x.id+'" aria-label="刪除">×</button></div>'}).join('')}
 show('<div class="page"><div class="wrap"><input class="ttl" id="ti" value="'+esc(s.title)+'" aria-label="故事名稱"><button class="btn exp" id="exS">匯出整個故事 .txt</button>'+
 '<div class="blk rv"><h2>世界觀與故事介紹</h2><p class="sub">寫下這個世界的規則、氛圍與故事的起點。</p><textarea class="area" id="intro" placeholder="這是一個怎樣的世界？">'+esc(s.intro)+'</textarea></div>'+
 '<div class="blk rv"><h2>角色介紹</h2><p class="sub">點擊角色名進入角色編輯。</p><div class="list">'+list(s.chars,'c')+'<button class="item add" id="addC" aria-label="新增角色">+</button></div></div>'+
 '<div class="blk rv"><h2>故事章節</h2><p class="sub">點擊章節開始寫作，按住左側 ⋮⋮ 拖曳可調整順序。</p><div class="clist">'+list(s.chapters,'w')+'</div><div class="list"><button class="item add" id="addW" aria-label="新增章節">+</button></div></div></div></div>','#/');
 bind($('#ti'),s,'title');bind($('#intro'),s,'intro');
 $('#exS').onclick=function(){exportTxt(s.title,storyTxt(s))};
 V.querySelectorAll('.grip').forEach(function(g){g.onclick=function(e){e.stopPropagation()};g.onpointerdown=function(e){
  e.preventDefault();var row=g.parentNode,box=row.parentNode;g.setPointerCapture(e.pointerId);row.classList.add('drag');
  g.onpointermove=function(ev){var rs=[].slice.call(box.children).filter(function(r){return r!==row});for(var i=0;i<rs.length;i++){var r=rs[i].getBoundingClientRect();if(ev.clientY<r.top+r.height/2){box.insertBefore(row,rs[i]);return}}box.appendChild(row)};
  g.onpointerup=g.onpointercancel=function(){g.onpointermove=g.onpointerup=g.onpointercancel=null;row.classList.remove('drag');var o=[].map.call(box.children,function(r){return r.dataset.id});s.chapters.sort(function(x,y){return o.indexOf(x.id)-o.indexOf(y.id)});save()}}});
 $('#addC').onclick=function(){dlg('角色名字',{input:1},function(n){var c={id:uid(),name:n,personality:'',look:'',background:'',extra:'',relations:''};s.chars.push(c);save();location.hash='#/s/'+s.id+'/c/'+c.id})};
 $('#addW').onclick=function(){dlg('章節標題',{input:1,ph:'例如：第一章 起霧的清晨'},function(n){var w={id:uid(),title:n,html:''};s.chapters.push(w);save();location.hash='#/s/'+s.id+'/w/'+w.id})};
 V.querySelectorAll('[data-go]').forEach(function(e){e.onclick=function(){location.hash=e.dataset.go};e.onkeydown=function(k){if(k.key==='Enter')e.click()}});
 V.querySelectorAll('[data-del]').forEach(function(b){b.onclick=function(ev){ev.stopPropagation();var k=b.dataset.del[0],id=b.dataset.del.slice(1);dlg('確定刪除？',{msg:'刪除後無法復原。',ok:'刪除'},function(){var key=k==='c'?'chars':'chapters';s[key]=s[key].filter(function(x){return x.id!==id});save();bg(s)})}});
}

/* 角色編輯區 */
function chr(s,c){
 var F=[['personality','個性和性格','喜歡什麼、害怕什麼、說話的方式…'],['look','外觀','身高、髮色、穿著、招牌小動作…'],['background','背景','出身、成長經歷、重要的轉折…'],['extra','額外設定','能力、物品、口頭禪、祕密…'],['relations','關係','與其他角色的羈絆、立場與距離…']];
 show('<div class="page"><div class="wrap"><input class="ttl" id="nm" value="'+esc(c.name)+'" aria-label="角色名"><p class="sub">'+esc(s.title)+' 的角色</p><div class="fgrid">'+
 F.map(function(f,i){return'<div class="blk rv'+(i===4?' full':'')+'"><h3>'+f[1]+'</h3><textarea class="area" data-k="'+f[0]+'" placeholder="'+f[2]+'">'+esc(c[f[0]])+'</textarea></div>'}).join('')+'</div></div></div>','#/s/'+s.id);
 bind($('#nm'),c,'name');V.querySelectorAll('[data-k]').forEach(function(a){bind(a,c,a.dataset.k)});
}

/* 寫作編輯區 */
function wr(s,w){
 var P='，。、！？；：「」『』（）…—～．'.split('');
 show('<div class="page"><div class="wrap"><input class="ttl" id="wt" value="'+esc(w.title)+'" aria-label="章節標題"><p class="sub">'+esc(s.title)+'</p><button class="btn exp" id="exW">匯出本章 .txt</button>'+
 '<div class="tb" role="toolbar"><select id="ff" aria-label="字型"><option value="">字型</option><option value="Noto Serif TC,serif">明體</option><option value="Noto Sans TC,sans-serif">黑體</option><option value="KaiTi,DFKai-SB,BiauKai,serif">楷體</option><option value="Georgia,serif">Georgia</option><option value="Courier New,monospace">等寬</option></select>'+
 '<select id="fs" aria-label="字級"><option value="">大小</option>'+[14,16,18,20,24,28,34].map(function(n){return'<option>'+n+'</option>'}).join('')+'</select><span class="sp"></span>'+
 '<button data-cmd="bold"><b>B</b></button><button data-cmd="italic"><i>I</i></button><button data-cmd="underline"><u>U</u></button><button data-cmd="strikeThrough"><s>S</s></button><span class="sp"></span>'+
 '<button data-cmd="justifyLeft" aria-label="靠左">⇤</button><button data-cmd="justifyCenter" aria-label="置中">↔</button><button data-cmd="insertUnorderedList" aria-label="清單">•</button><span class="sp"></span>'+
 '<button data-cmd="undo" aria-label="復原">↶</button><button data-cmd="redo" aria-label="重做">↷</button><span class="sp"></span>'+
 P.map(function(p){return'<button data-p="'+p+'">'+p+'</button>'}).join('')+'</div>'+
 '<div class="paper" id="ed" contenteditable="true" spellcheck="false">'+w.html+'</div><div class="cnt" id="cn"></div></div></div>','#/s/'+s.id);
 var ed=$('#ed');bind($('#wt'),w,'title');
 function upd(){w.html=ed.innerHTML;$('#cn').textContent=ed.innerText.replace(/\s/g,'').length+' 字 · 已自動儲存';save()}
 ed.oninput=upd;upd();
 $('#exW').onclick=function(){exportTxt(s.title+' - '+w.title,w.title+'\n\n'+h2t(w.html))};
 V.querySelectorAll('.tb button').forEach(function(b){b.onmousedown=function(e){e.preventDefault()};b.onclick=function(){
  ed.focus();
  if(b.dataset.p)document.execCommand('insertText',false,b.dataset.p);else document.execCommand(b.dataset.cmd,false,null);upd()}});
 $('#ff').onchange=function(){if(this.value){ed.focus();document.execCommand('fontName',false,this.value);upd()}this.selectedIndex=0};
 $('#fs').onchange=function(){var v=this.value;if(v){ed.focus();document.execCommand('fontSize',false,'7');ed.querySelectorAll('font[size="7"]').forEach(function(f){var sp=document.createElement('span');sp.style.fontSize=v+'px';while(f.firstChild)sp.appendChild(f.firstChild);f.replaceWith(sp)});upd()}this.selectedIndex=0};
}

function route(){
 var p=location.hash.replace('#/','').split('/').filter(Boolean),s=p[0]==='s'&&story(p[1]);
 if(!s)return home();
 if(p[2]==='c'){var c=s.chars.filter(function(x){return x.id===p[3]})[0];if(c)return chr(s,c)}
